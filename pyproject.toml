[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dep-risk"
version = "1.0.0"
description = "Supply chain risk scorer for npm, pip, and cargo dependencies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dilates", email = "dilateig@gmail.com" }]
requires-python = ">=3.11"
keywords = ["security", "supply-chain", "dependencies", "npm", "pip", "cargo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
dep-risk = "dep_risk.cli:main"

[project.urls]
Homepage = "https://github.com/dilates/dep-risk"
Repository = "https://github.com/dilates/dep-risk"
"Bug Tracker" = "https://github.com/dilates/dep-risk/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dep_risk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
